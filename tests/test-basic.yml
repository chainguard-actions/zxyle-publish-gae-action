name: Test basic usage - publish GAE action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal app.yaml in workspace root
        run: |
          cat > "$GITHUB_WORKSPACE/app.yaml" <<'EOF'
          runtime: nodejs14
          service: default
          EOF

      - name: Create a fake base64-encoded service account key
        id: prep
        run: |
          # Create a minimal fake service account JSON and base64-encode it
          FAKE_KEY='{"type":"service_account","project_id":"test-project","private_key_id":"key123","private_key":"-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAqGTkzMFB2pBMBMQBNMo\n-----END RSA PRIVATE KEY-----\n","client_email":"test@test-project.iam.gserviceaccount.com","client_id":"123456789","auth_uri":"https://accounts.google.com/o/oauth2/auth","token_uri":"https://oauth2.googleapis.com/token"}'
          ENCODED=$(echo -n "$FAKE_KEY" | base64 -w 0)
          echo "encoded_key=$ENCODED" >> $GITHUB_OUTPUT

      - id: action
        uses: .
        with:
          service_account_email: test@test-project.iam.gserviceaccount.com
          service_account_key: ${{ steps.prep.outputs.encoded_key }}
          project_id: test-project

      - name: Assert client-secret.json was written
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/client-secret.json" ]; then
            echo "FAIL: client-secret.json was not created"
            exit 1
          fi
          echo "PASS: client-secret.json exists"

      - name: Assert client-secret.json contains expected content
        run: |
          CONTENT=$(cat "$GITHUB_WORKSPACE/client-secret.json")
          echo "content: $CONTENT"
          if echo "$CONTENT" | grep -q '"type":"service_account"'; then
            echo "PASS: client-secret.json contains service_account type"
          else
            echo "FAIL: client-secret.json does not contain expected content"
            exit 1
          fi
