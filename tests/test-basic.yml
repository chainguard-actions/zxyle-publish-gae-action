name: Test basic invocation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Invoke Deploy Google App Engine action
        id: action
        uses: .
        continue-on-error: true

      - name: Assert action was attempted
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action is a Docker action with no entrypoint/cmd and no credentials.
          # It will exit non-zero, but the step should not be 'cancelled'.
          # Accept success or failure — both mean the action was invoked.
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action was attempted with outcome=$OUTCOME"
