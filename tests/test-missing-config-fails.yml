name: Test missing config file causes failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure no app.yaml exists at workspace root
        run: |
          rm -f "$GITHUB_WORKSPACE/app.yaml"
          echo "Removed app.yaml from workspace root (if it existed)"
          ls -la "$GITHUB_WORKSPACE/" | grep app.yaml || echo "Confirmed: no app.yaml at workspace root"

      - id: action
        uses: .
        with:
          service_account_email: test@example.iam.gserviceaccount.com
          service_account_key: dGVzdC1rZXktY29udGVudA==
          project_id: my-test-project
        continue-on-error: true

      - name: Assert action failed when config is missing
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when app.yaml is missing, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when app.yaml was missing"
