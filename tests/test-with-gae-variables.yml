name: Test invocation with optional gae_variables input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Invoke action with gae_variables optional input (expect failure due to invalid credentials)
        id: action
        uses: .
        continue-on-error: true
        with:
          service_account_email: test@example-project.iam.gserviceaccount.com
          service_account_key: eyJmYWtlIjoidGVzdCIsInR5cGUiOiJzZXJ2aWNlX2FjY291bnQifQ==
          project_id: example-project
          gae_variables: "ENV=production,REGION=us-central1"
      - name: Assert action was invoked with gae_variables (outcome should be failure due to invalid credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected with invalid credentials"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS"
