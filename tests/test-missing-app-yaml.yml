name: Test error handling when app.yaml is missing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure app.yaml does not exist
        run: |
          rm -f "$GITHUB_WORKSPACE/app.yaml"
          echo "Removed app.yaml if it existed"

      - name: Prepare fake service account key
        id: prep
        run: |
          FAKE_KEY='{"type":"service_account","project_id":"my-project","client_email":"test@my-project.iam.gserviceaccount.com"}'
          ENCODED_KEY=$(echo -n "$FAKE_KEY" | base64 -w 0)
          echo "encoded_key=$ENCODED_KEY" >> "$GITHUB_OUTPUT"

      - id: action
        uses: .
        continue-on-error: true
        with:
          service_account_email: test@my-project.iam.gserviceaccount.com
          service_account_key: ${{ steps.prep.outputs.encoded_key }}
          project_id: my-project

      - name: Assert action failed due to missing app.yaml
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when app.yaml is missing, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when app.yaml was missing"
