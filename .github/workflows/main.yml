name: Test Actions

on: [push]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Initialize Google Cloud SDK
      # This action is located on https://github.com/zxyle/publish-gae-action
      uses: zxyle/publish-gae-action@09db96d2cf1cdfb1d100d6a5bb1b0bc10fc7f7ca # master
      with:
        service_account_email: ${{ secrets.GCP_SA_EMAIL }}
        service_account_key: ${{ secrets.GCP_SA_KEY }}
        project_id: ${{ secrets.PROJECT_ID }}

    - name: Print Google Cloud SDK version
      env:
        GCP_SA_EMAIL: ${{ secrets.GCP_SA_EMAIL }}
      run: |
        # This client-secret.json is converted by GCP_SA_KEY.
        gcloud auth activate-service-account "$GCP_SA_EMAIL" --key-file=client-secret.json
        gcloud info
